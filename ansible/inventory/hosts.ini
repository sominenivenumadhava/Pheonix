# ==============================================================================
# Phoenix - Ansible Inventory (hosts.ini)
# Targets: VirtualBox Host-Only Network (192.168.56.0/24) / AWS EC2
# ==============================================================================

[app]
app-server ansible_host=192.168.56.30

[puppet]
puppet-master ansible_host=192.168.56.20

[nagios]
nagios-server ansible_host=192.168.56.40

# Group of all Phoenix managed infrastructure nodes
[phoenix_nodes:children]
app
puppet
nagios

[phoenix_nodes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
