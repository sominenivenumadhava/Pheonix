# ==============================================================================
# Phoenix Nagios Contacts (contacts.cfg)
# ==============================================================================

define contact {
    contact_name                    nagiosadmin
    use                             generic-contact
    alias                           Phoenix System Administrator
    email                           admin@phoenix.local
}

define contactgroup {
    contactgroup_name               admins
    alias                           Phoenix System Administrators
    members                         nagiosadmin
}
