# ==============================================================================
# Phoenix Nagios Hosts Definition (hosts.cfg)
# Targets: VirtualBox Host-Only IPs / AWS EC2 Private IPs
# ==============================================================================

define host {
    use         generic-host
    host_name   app-server
    alias       Phoenix Production Application Server
    address     192.168.56.30
}

define host {
    use         generic-host
    host_name   puppet-master
    alias       Phoenix Puppet Master & CA Authority
    address     192.168.56.20
}

define host {
    use         generic-host
    host_name   nagios-server
    alias       Phoenix Nagios Core Monitoring Node
    address     127.0.0.1
}

define hostgroup {
    hostgroup_name  phoenix-servers
    alias           All Phoenix Business & Infrastructure Servers
    members         app-server,puppet-master,nagios-server
}
