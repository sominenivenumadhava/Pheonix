# ==============================================================================
# Phoenix Nagios Services Definition (services.cfg)
# Comprehensive service monitors including custom Python and Bash plugins
# ==============================================================================

# --- APP-SERVER SERVICES ---
define service {
    use                 generic-service
    host_name           app-server
    service_description SSH Service
    check_command       check_ssh
}

define service {
    use                 generic-service
    host_name           app-server
    service_description HTTP Web Server
    check_command       check_http!80!/
}

define service {
    use                 generic-service
    host_name           app-server
    service_description Disk Utilization
    check_command       check_nrpe!check_disk
}

define service {
    use                 generic-service
    host_name           app-server
    service_description System Load Average
    check_command       check_nrpe!check_load
}

# Custom Plugin 1: Portal /health Endpoint & Response Latency
define service {
    use                 generic-service
    host_name           app-server
    service_description Portal Health & Latency
    check_command       check_portal_health!80!/health!500!1500
    check_interval      1
    retry_interval      1
}

# Custom Plugin 2: Nginx Recent 5xx Server Error Scan
define service {
    use                 generic-service
    host_name           app-server
    service_description Nginx HTTP 5xx Errors
    check_command       check_web_errors!/var/log/nginx/access.log!5!20!5
    check_interval      1
    retry_interval      1
}

# --- PUPPET-MASTER SERVICES ---
define service {
    use                 generic-service
    host_name           puppet-master
    service_description SSH Service
    check_command       check_ssh
}

define service {
    use                 generic-service
    host_name           puppet-master
    service_description Puppet Server Port 8140
    check_command       check_tcp!8140
}

define service {
    use                 generic-service
    host_name           puppet-master
    service_description System Load
    check_command       check_nrpe!check_load
}

# --- NAGIOS-SERVER SERVICES ---
define service {
    use                 generic-service
    host_name           nagios-server
    service_description SSH Service
    check_command       check_ssh
}

define service {
    use                 generic-service
    host_name           nagios-server
    service_description Nagios Apache Web UI
    check_command       check_http!80!/nagios/
}
